{% load translate %}
{% load static %}

<div class="modal-body">
    <div class="row">
        <div class="col-lg-12">
            <div class="mb-3">
                <label class="form-label">{% translate 'chapter_number' request.session.language %}</label>
                <input type="text" name="chapter_number" value="{{chapter.chapter_number}}" required class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">{% translate 'title' request.session.language %}</label>
                <input type="text" name="title" value="{{chapter.title}}" required class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label">{% translate 'description' request.session.language %}</label>
                <textarea name="description" rows="5" class="form-control">{{chapter.description}}</textarea>
            </div>
        </div>
    </div>
</div>
