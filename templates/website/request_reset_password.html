{% extends 'website/components/base.html' %}
{% load static %}

{% block title %}Forgot Password | DigiLex{% endblock %}

{% block body %}
<div class="d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="w-100 p-4 bg-white rounded-4 border shadow-sm" style="max-width: 420px;">
        
        <!-- Header Branding Element -->
        <div class="text-center mb-4">
            <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-2" style="width: 60px; height: 60px; background-color: #0d1b3e;">
                <i class="bi bi-shield-lock text-white" style="font-size: 24px;"></i>
            </div>
            <h4 class="fw-bold mb-1" style="color: #0d1b3e;">Forgot Password</h4>
            <p class="text-muted small">Enter your registered email and we'll send you an OTP to reset your account credentials.</p>
        </div>

        <!-- Submission Pipeline Form -->
        <form method="POST" action="{% url 'request_reset_password' %}">
            {% csrf_token %}
            
            <div class="mb-4">
                <label class="form-label small fw-bold text-secondary text-uppercase">Email Address</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" name="email" class="form-control bg-light border-start-0 ps-0" placeholder="example@gmail.com" required style="font-size: 14px; box-shadow: none;">
                </div>
            </div>

            <button class="btn w-100 py-3 rounded-3 fw-bold text-white mb-2" type="submit" style="background-color: #0d1b3e; font-size: 14px;">
                Send Verification Code
            </button>
        </form>

        <!-- Dynamic Navigation Redirection Links -->
        <div class="text-center mt-3">
            <a href="{% url 'login' %}" class="small fw-bold text-decoration-none" style="color: #d4a017;">
                <i class="bi bi-arrow-left me-1"></i> Back to Sign In
            </a>
        </div>

    </div>
</div>
{% endblock %}
