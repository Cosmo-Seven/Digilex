<style>
  /* Mobile drawer styles */
  #overlayBg {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .45);
    opacity: 0;
    visibility: hidden;
    transition: opacity .25s, visibility .25s;
    z-index: 1040;
  }

  #overlayBg.active {
    opacity: 1;
    visibility: visible;
  }

  #mobileDrawer {
    position: fixed;
    left: -320px;
    top: 0;
    width: 320px;
    height: 100%;
    background: #0d1b3e;
    z-index: 1050;
    transition: left .28s ease;
    padding: 1.25rem 1rem;
    overflow-y: auto;
  }

  #mobileDrawer.active {
    left: 0;
  }

  #mobileDrawer .close-drawer {
    border: 0;
    background: transparent;
    font-size: 20px;
    color: #fff;
  }

  /* Force display desktop sidebar elements inside mobile drawer */
  #mobileDrawer .desktop-sidebar.d-none {
    display: block !important;
    padding: 0;
    border: 0;
    background: transparent;
  }

  /* Header Actions & Search */
  .header-actions {
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }

  .header-actions .action {
    display: none;
  }

  .header-search {
    min-width: 280px;
    max-width: 420px;
  }

  .header-search .form-control {
    background: rgba(255, 255, 255, .08);
    border: 1px solid rgba(255, 255, 255, .2);
    color: #fff;
  }

  .header-search .form-control::placeholder {
    color: rgba(255, 255, 255, .7);
  }

  .header-search .btn {
    border: 1px solid rgba(255, 255, 255, .2);
    color: #fff;
  }

  .header-dropdown .dropdown-toggle::after {
    margin-left: .25rem;
  }

  /* Mobile Drawer Menu Custom Styling */
  .mobile-nav-link {
    display: flex;
    align-items: center;
    padding: 0.75rem 1rem;
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    transition: background 0.2s;
  }

  .mobile-nav-link:hover, .mobile-nav-link:active {
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
  }

  @media (min-width: 992px) {
    .header-actions .action {
      display: inline-flex;
    }

    #mobileToggleBtn {
      display: none;
    }

    .desktop-header-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
  }

  @media (max-width: 991.98px) {
    .desktop-header-group {
      display: none;
    }
  }
</style>

  </div>
</div>

<!-- JavaScript for Drawer Toggle -->
<script>
  function openMenu() {
    document.getElementById('mobileDrawer').classList.add('active');
    document.getElementById('overlayBg').classList.add('active');
    document.getElementById('mobileDrawer').setAttribute('aria-hidden', 'false');
  }

  function closeMenu() {
    document.getElementById('mobileDrawer').classList.remove('active');
    document.getElementById('overlayBg').classList.remove('active');
    document.getElementById('mobileDrawer').setAttribute('aria-hidden', 'true');
  }
</script>
